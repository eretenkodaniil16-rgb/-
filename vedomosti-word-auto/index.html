<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Генератор ведомостей — цельное копирование</title><style>html,body{margin:0;height:100%;background:#f3f5f7;font:14px Arial}.bar{padding:8px 14px;background:#163d8c;color:#fff}.bar b{margin-right:8px}iframe{display:block;border:0;width:100%;height:calc(100% - 38px)}</style></head><body><div class="bar"><b>Режим цельного копирования в Word</b> После подготовки нажмите «Копировать весь документ в Word» — выделять вручную ничего не нужно.</div><iframe id="app" src="../vedomosti-word/" allow="clipboard-read; clipboard-write"></iframe><script>(function(){var f=document.getElementById('app');function patch(){var w=f.contentWindow,d=f.contentDocument;if(!d||!d.getElementById)return;var btn=d.getElementById('copy'),sel=d.getElementById('select'),doc=d.getElementById('worddoc'),os=d.getElementById('os');if(!btn||!doc)return;if(sel)sel.style.display='none';btn.innerHTML='Копировать весь документ в Word';var p=d.querySelector('#wordarea p');if(p)p.innerHTML='<b>Нажмите «Копировать весь документ в Word» → откройте Word → Ctrl+V.</b> Весь макет копируется автоматически одним блоком; ничего дополнительно выделять не требуется.';function msg(t,e){if(!os)return;os.className='st '+(e?'er':'ok');os.innerText=t}function hasClass(el,n){return(' '+(el.className||'')+' ').indexOf(' '+n+' ')>=0}function prepare(){var c=doc.cloneNode(true),i,a,t,x,kind=doc.getAttribute('data-kind')||'';a=c.getElementsByTagName('style');while(a.length)a[0].parentNode.removeChild(a[0]);a=c.getElementsByTagName('table');for(i=0;i<a.length;i++){t=a[i];t.style.borderCollapse='collapse';t.style.tableLayout='fixed';t.style.pageBreakInside='avoid';t.style.breakInside='avoid';t.style.marginTop='0';t.style.marginBottom='0';if(hasClass(t,'journal-table')){t.style.width='11.4cm';t.style.minWidth='11.4cm';t.style.maxWidth='11.4cm';t.style.marginLeft='auto';t.style.marginRight='auto'}if(hasClass(t,'lecture-table')){t.style.width='28.1cm';t.style.maxWidth='28.1cm'}}a=c.querySelectorAll('td,th');for(i=0;i<a.length;i++){x=a[i];x.style.border='1px solid #000';x.style.verticalAlign='middle';if(!x.style.padding)x.style.padding='2px 5px';var tb=x;while(tb&&tb.tagName!='TABLE')tb=tb.parentNode;if(tb&&hasClass(tb,'journal-table')){x.style.width='5.7cm';x.style.minWidth='5.7cm';x.style.maxWidth='5.7cm'}}a=c.getElementsByClassName('group-new-page');for(i=0;i<a.length;i++){a[i].style.pageBreakBefore='always';a[i].style.breakBefore='page'}a=c.getElementsByClassName('lecture-page');for(i=0;i<a.length;i++){a[i].style.fontFamily='Times New Roman,serif';a[i].style.width='28.1cm';a[i].style.maxWidth='28.1cm';a[i].style.pageBreakInside='avoid';a[i].style.breakInside='avoid'}a=c.getElementsByClassName('journal-group');for(i=0;i<a.length;i++){a[i].style.pageBreakInside='avoid';a[i].style.breakInside='avoid'}a=c.getElementsByClassName('numcol');for(i=0;i<a.length;i++)a[i].style.width='1.12cm';a=c.getElementsByClassName('fiocol');for(i=0;i<a.length;i++)a[i].style.width='7.59cm';a=c.getElementsByClassName('attcol');for(i=0;i<a.length;i++)a[i].style.width='1.94cm';a=c.getElementsByClassName('lecture-title');for(i=0;i<a.length;i++){a[i].style.textAlign='center';a[i].style.fontWeight='bold'}a=c.getElementsByClassName('presence');for(i=0;i<a.length;i++){a[i].style.textAlign='center';a[i].style.fontWeight='bold'}a=c.getElementsByClassName('subhead');for(i=0;i<a.length;i++){a[i].style.textAlign='center';a[i].style.fontWeight='bold'}var wrap=d.createElement('div');wrap.appendChild(c);var css='<style>table{border-collapse:collapse;table-layout:fixed;page-break-inside:avoid}td,th{border:1px solid #000}.group-new-page{page-break-before:always}.journal-table{width:11.4cm}.journal-table td,.journal-table th{width:5.7cm}</style>';if(kind==='l')css+='<style>@page{size:29.7cm 21cm;margin:.8cm}</style>';else css+='<style>@page{size:21cm 29.7cm;margin:1.5cm}</style>';return{node:c,html:'<html><head><meta charset="utf-8">'+css+'</head><body>'+wrap.innerHTML+'</body></html>',text:doc.innerText||doc.textContent||''}}function selectNode(el){var r,s;if(d.body.createTextRange){r=d.body.createTextRange();r.moveToElementText(el);r.select();return true}if(d.createRange&&w.getSelection){r=d.createRange();r.selectNodeContents(el);s=w.getSelection();s.removeAllRanges();s.addRange(r);return true}return false}function fallback(o){var h=d.createElement('div'),ok=false;h.contentEditable='true';h.style.position='fixed';h.style.left='-12000px';h.style.top='0';h.style.width='29cm';h.style.background='#fff';h.appendChild(o.node);d.body.appendChild(h);try{h.focus();selectNode(h);ok=d.execCommand('copy')}catch(e){}try{d.body.removeChild(h)}catch(e2){}return ok}btn.onclick=function(){var o=prepare();msg('Копирую весь документ целиком…',false);try{if(w.navigator.clipboard&&w.ClipboardItem&&w.navigator.clipboard.write){var it={};it['text/html']=new w.Blob([o.html],{type:'text/html'});it['text/plain']=new w.Blob([o.text],{type:'text/plain'});w.navigator.clipboard.write([new w.ClipboardItem(it)]).then(function(){msg('Скопировано целиком. Откройте Word и нажмите Ctrl+V. Ничего выделять не нужно.',false)},function(){msg(fallback(o)?'Скопировано целиком. Откройте Word и нажмите Ctrl+V. Ничего выделять не нужно.':'Браузер запретил копирование. Нажмите кнопку ещё раз.',!fallback(o))});return}}catch(e){}msg(fallback(o)?'Скопировано целиком. Откройте Word и нажмите Ctrl+V. Ничего выделять не нужно.':'Браузер запретил копирование. Нажмите кнопку ещё раз.',!fallback(o))};btn.setAttribute('data-auto-copy','1')}f.onload=function(){try{patch();setInterval(patch,1200)}catch(e){}}})();</script></body></html>
